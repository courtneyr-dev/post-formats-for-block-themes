name: Deploy to WordPress.org

on:
  release:
    types: [published]
  # Manual re-run path: release events pin the workflow file to the tagged
  # commit, so a fixed workflow can't re-serve an already-published tag
  # without this.
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy (must match readme.txt Stable tag, e.g. 2.3.0)'
        required: true

# Shared with readme-sync.yml so a release and a readme sync never overlap.
concurrency:
  group: wordpress-org-post-formats-for-block-themes
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        # Strip a leading "v" so the SVN tag matches readme.txt's Stable tag.
        env:
          RAW: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
        run: |
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, wp-cli

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript assets
        run: npm run build

      - name: Generate translation files
        # Non-fatal: wp.org builds language packs from translate.wordpress.org
        # for hosted plugins, so the bundled .pot is a convenience. make-pot
        # fetches block-i18n.json from develop.svn.wordpress.org, which times
        # out entirely when wp.org SVN is degraded (observed 2026-07-03).
        run: |
          for i in 1 2 3; do
            composer i18n && exit 0
            echo "make-pot attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "::warning::.pot generation failed (develop.svn.wordpress.org unreachable); shipping without an updated .pot"

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: post-formats-for-block-themes
          VERSION: ${{ steps.version.outputs.version }}
      # No release-asset upload: GitHub releases are immutable once published,
      # so a release-triggered workflow can never attach assets to its own
      # release (v1.1.6 run 32419509081 failed on exactly that). The canonical
      # zip is the one wp.org builds from SVN:
      # https://downloads.wordpress.org/plugin/post-formats-for-block-themes.{version}.zip
