name: Deploy to WordPress.org

on:
  release:
    types: [published]
  # Manual re-run path: release events pin the workflow file to the tagged
  # commit, so a fixed workflow can't re-serve an already-published tag
  # without this.
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy (must match readme.txt Stable tag, e.g. 2.3.0)'
        required: true

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        # Strip a leading "v" so the SVN tag matches readme.txt's Stable tag.
        env:
          RAW: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
        run: |
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, wp-cli

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript assets
        run: npm run build

      - name: Generate translation files
        # Non-fatal: wp.org builds language packs from translate.wordpress.org
        # for hosted plugins, so the bundled .pot is a convenience. make-pot
        # fetches block-i18n.json from develop.svn.wordpress.org, which times
        # out entirely when wp.org SVN is degraded (observed 2026-07-03).
        run: |
          for i in 1 2 3; do
            composer i18n && exit 0
            echo "make-pot attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "::warning::.pot generation failed (develop.svn.wordpress.org unreachable); shipping without an updated .pot"

      - name: Create distribution archive
        run: |
          mkdir -p dist
          rsync -av --exclude-from='.distignore' . dist/post-formats-for-block-themes/
          cd dist
          zip -r ../post-formats-for-block-themes.zip post-formats-for-block-themes/

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: post-formats-for-block-themes
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./post-formats-for-block-themes.zip
          asset_name: post-formats-for-block-themes-${{ github.event.release.tag_name }}.zip
          asset_content_type: application/zip
