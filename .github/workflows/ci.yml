name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHPCS + PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer, cs2pr

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPCS
        # --graceful-warnings matches the ruleset's ignore_warnings_on_exit:
        # errors fail the build, warnings surface as annotations only.
        run: composer phpcs -- --report=checkstyle | cs2pr --graceful-warnings

      - name: Run PHPStan
        run: composer phpstan

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        wordpress: ["6.9", "7.0", "latest"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # No MYSQL_DATABASE here: install-wp-tests.sh runs mysqladmin
          # create itself and hard-fails if the database already exists.
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          coverage: xdebug
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Subversion
        # install-wp-tests.sh checks out the WP test library via svn,
        # which GitHub removed from ubuntu runners in 2024.
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }}

      - name: Run PHPUnit
        run: composer phpunit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start WordPress (wp-env)
        run: npx --yes @wordpress/env@latest start

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          WP_BASE_URL: http://localhost:8888

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Composer audit
        id: composer-audit
        continue-on-error: true
        run: composer audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit
        id: npm-audit
        continue-on-error: true
        # Nothing in node_modules ships to users — @wordpress/* imports are
        # externalized to core at build time — so shipped (prod) deps gate at
        # moderate while the dev toolchain gates at critical (upstream
        # @wordpress/scripts carries advisories with no fixed release).
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=critical

      - name: Check audit results
        if: steps.composer-audit.outcome == 'failure' || steps.npm-audit.outcome == 'failure'
        run: |
          echo "Security vulnerabilities found."
          exit 1

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [phpunit, e2e, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install npm dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Build
        run: npm run build

      - name: Create distribution archive
        run: |
          mkdir -p dist
          rsync -av --exclude-from='.distignore' . dist/post-formats-for-block-themes/
          cd dist
          zip -r post-formats-for-block-themes.zip post-formats-for-block-themes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-formats-for-block-themes-zip
          path: dist/post-formats-for-block-themes.zip
