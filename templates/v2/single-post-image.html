<!-- Single post template for the Image format.

	Plugin-shipped opt-in starter. Register via class-block-templates.php
	when the pfbt_use_block_templates option is enabled.

	The body is a single wp:pattern reference to pfbt/image-single — all
	visual layout lives in the pattern, so themes that want to override
	the Image single rendering can just override the pattern (or
	re-register their own template at the same slug).

	@since 2.0.0 -->

	<!-- wp:pattern {"slug":"pfbt/image-single"} /-->

</main>
