name: Deploy to WordPress.org

# Publishing a GitHub release vX.Y.Z deploys that tag to WordPress.org SVN.
# The job waits in the wordpress-org environment for approval, refuses a
# version that doesn't match readme.txt's Stable tag, and isn't done until the
# WordPress.org API serves the new version.
on:
  release:
    types: [published]
  # Manual re-run path: release events pin the workflow file to the tagged
  # commit, so a fixed workflow can't re-serve an already-published tag
  # without this.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (must match readme.txt Stable tag, e.g. 1.2.3)'
        required: true

permissions: {}

# Shared with asset-update.yml and readme-sync.yml so SVN writes never overlap.
concurrency:
  group: wordpress-org-post-formats-for-block-themes
  cancel-in-progress: false

env:
  SLUG: post-formats-for-block-themes

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    if: >
      github.repository == 'courtneyr-dev/post-formats-for-block-themes' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-24.04
    environment: wordpress-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', github.event.inputs.version) }}
          persist-credentials: false

      - name: Resolve and check the version
        id: version
        # Strip a leading "v" so the SVN tag matches readme.txt's Stable tag.
        env:
          RAW: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version }}
        run: |
          read_stable_tag() { sed -nE 's/^[Ss]table [Tt]ag:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "$1" | head -n 1; }
          version="${RAW#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$RAW' isn't a release version."; exit 1
          fi
          stable=$(read_stable_tag readme.txt)
          if [ "$version" != "$stable" ]; then
            echo "::error::Release $version doesn't match readme.txt Stable tag $stable."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, wp-cli

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build JavaScript assets
        run: npm run build

      - name: Generate translation files
        # Non-fatal: wp.org builds language packs from translate.wordpress.org
        # for hosted plugins, so the bundled .pot is a convenience. make-pot
        # fetches block-i18n.json from develop.svn.wordpress.org, which times
        # out entirely when wp.org SVN is degraded (observed 2026-07-03).
        run: |
          for i in 1 2 3; do
            composer i18n && exit 0
            echo "make-pot attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "::warning::.pot generation failed (develop.svn.wordpress.org unreachable); shipping without an updated .pot"

      - name: Keep only listing assets in .wordpress-org
        # assets/ on SVN is for banners, icons, screenshots and the preview
        # Blueprint. Notes and .gitkeep files would be published there too.
        run: |
          mkdir -p .wordpress-org
          find .wordpress-org -maxdepth 1 -type f \
            ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.gif' ! -iname '*.svg' \
            -print -delete

      - name: Keep the live preview Blueprint when the repo has none
        # The action syncs .wordpress-org/ with --delete, which would remove
        # assets/blueprints/ from SVN and the Live Preview button with it.
        run: |
          if [ ! -f .wordpress-org/blueprints/blueprint.json ]; then
            url="https://plugins.svn.wordpress.org/$SLUG/assets/blueprints/blueprint.json"
            if curl -fsSL "$url" -o /tmp/blueprint.json; then
              mkdir -p .wordpress-org/blueprints
              mv /tmp/blueprint.json .wordpress-org/blueprints/blueprint.json
              echo "Kept the live Blueprint from $url"
            fi
          fi

      - name: Install Subversion
        timeout-minutes: 5
        shell: bash
        run: |
          if ! command -v svn >/dev/null; then
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends subversion
          fi
          svn --version --quiet

      - name: WordPress plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: post-formats-for-block-themes
          VERSION: ${{ steps.version.outputs.version }}
      # No release-asset upload: a release-triggered run can't attach files to
      # an immutable release. The canonical zip is the one WordPress.org builds:
      # https://downloads.wordpress.org/plugin/post-formats-for-block-themes.{version}.zip

      - name: Prove the deploy landed
        # A green deploy step has shipped nothing before (Outpost). Done means
        # the plugin API serves the new version.
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          for _ in $(seq 1 10); do
            live=$(curl -fsS "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&slug=$SLUG&fields=version" | jq -r '.version // empty')
            [ "$live" = "$V" ] && { echo "WordPress.org serves $live"; exit 0; }
            echo "WordPress.org serves ${live:-nothing} (want $V); waiting 60s"
            sleep 60
          done
          echo "::error::WordPress.org never served $V. Check https://plugins.trac.wordpress.org/browser/$SLUG/tags/$V"
          exit 1
