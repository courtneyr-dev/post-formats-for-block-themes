<?xml version="1.0" encoding="UTF-8"?>
<!--
	Post Formats for Block Themes — Icon sprite.

	Nine SVG <symbol> entries, one per non-standard post format. Standard
	format intentionally has no icon (per Twenty Thirteen layout reference:
	standard posts get a normal title without a format indicator).

	Design rules:
	  - viewBox 0 0 24 24
	  - stroke="currentColor" so the theme's text color drives the icon
	  - fill="none" by default; filled regions use class="pfbt-icon-fill"
	    which the format-tokens.css stylesheet overrides to currentColor
	  - stroke-width 1.75 for visual parity at small + large sizes
	  - stroke-linecap and stroke-linejoin "round" for a hand-drawn feel

	Sprite is referenced via <use href="format-icons.svg#pfbt-format-icon-{slug}">
	from the Format Icon block (post-formats/format-icon).

	Themes can replace this sprite via the pfbt_format_icon_sprite_url
	filter, or replace individual icon SVG output via pfbt_format_icon_svg.

	@since 2.0.0
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
	<defs>
		<style>
			symbol path,
			symbol rect,
			symbol circle {
				fill: none;
				stroke: currentColor;
				stroke-width: 1.75;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			symbol .pfbt-icon-fill {
				fill: currentColor;
				stroke: none;
			}
		</style>
	</defs>

	<!--
		Aside: a sticky note with a folded bottom-right corner.
		Mirrors the Twenty Thirteen "callout" / aside-as-note treatment.
	-->
	<symbol id="pfbt-format-icon-aside" viewBox="0 0 24 24">
		<title>Aside</title>
		<rect x="5" y="6" width="14" height="14"></rect>
		<rect x="3" y="3" width="18" height="3.5"></rect>
		<path d="M8 11 H16"></path>
		<path d="M8 14 H13"></path>
		<path d="M16 20 L19 17"></path>
		<path class="pfbt-icon-fill" d="M16 20 L19 20 L19 17 Z"></path>
	</symbol>

	<!--
		Audio: simple speaker silhouette with two sound-wave arcs.
		Inherits color from currentColor; theme paints background via
		the format-audio-bg token.
	-->
	<symbol id="pfbt-format-icon-audio" viewBox="0 0 24 24">
		<title>Audio</title>
		<path d="M4 9 V15 H8 L13 19 V5 L8 9 Z"></path>
		<path d="M16 9 Q18 12 16 15"></path>
		<path d="M18.5 7 Q21.5 12 18.5 17"></path>
	</symbol>

	<!--
		Chat: speech bubble with a pointer tail. Three short horizontal
		lines inside represent message content.
	-->
	<symbol id="pfbt-format-icon-chat" viewBox="0 0 24 24">
		<title>Chat</title>
		<path d="M4 5 H20 V16 H10 L6 20 V16 H4 Z"></path>
		<path d="M7 9 H17"></path>
		<path d="M7 12 H14"></path>
	</symbol>

	<!--
		Gallery: three overlapping image frames suggesting a stack.
	-->
	<symbol id="pfbt-format-icon-gallery" viewBox="0 0 24 24">
		<title>Gallery</title>
		<rect x="3" y="7" width="13" height="13"></rect>
		<rect x="6" y="5" width="13" height="13"></rect>
		<rect x="9" y="3" width="12" height="12"></rect>
	</symbol>

	<!--
		Image: single picture frame with a horizon line and a dot for sun/moon.
	-->
	<symbol id="pfbt-format-icon-image" viewBox="0 0 24 24">
		<title>Image</title>
		<rect x="3.5" y="4.5" width="17" height="15"></rect>
		<circle cx="9" cy="9.5" r="1.6"></circle>
		<path d="M3.5 16 L8.5 12 L12.5 15 L16 12 L20.5 16"></path>
	</symbol>

	<!--
		Link: two interlocked chain segments, classic link-format glyph.
	-->
	<symbol id="pfbt-format-icon-link" viewBox="0 0 24 24">
		<title>Link</title>
		<path d="M10 14 L14 10"></path>
		<path d="M9 7 L11 5 A4 4 0 0 1 17 11 L15 13"></path>
		<path d="M15 17 L13 19 A4 4 0 0 1 7 13 L9 11"></path>
	</symbol>

	<!--
		Quote: a single large opening quotation mark above a cite-bar.
		The mark is filled (using .pfbt-icon-fill) so it reads at small sizes.
	-->
	<symbol id="pfbt-format-icon-quote" viewBox="0 0 24 24">
		<title>Quote</title>
		<path class="pfbt-icon-fill" d="M6 6 H10 V10 Q10 13 7 14 L6 12 Q8 11 8 10 H6 Z"></path>
		<path class="pfbt-icon-fill" d="M14 6 H18 V10 Q18 13 15 14 L14 12 Q16 11 16 10 H14 Z"></path>
		<path d="M5 19 H19"></path>
	</symbol>

	<!--
		Status: two small circles representing "online / now" pulse.
		Distinct from the chat speech-bubble — status is a state, not a message.
	-->
	<symbol id="pfbt-format-icon-status" viewBox="0 0 24 24">
		<title>Status</title>
		<circle cx="12" cy="12" r="2.5" class="pfbt-icon-fill"></circle>
		<circle cx="12" cy="12" r="6"></circle>
		<circle cx="12" cy="12" r="9.5"></circle>
	</symbol>

	<!--
		Video: a film frame outline with a play triangle inside.
	-->
	<symbol id="pfbt-format-icon-video" viewBox="0 0 24 24">
		<title>Video</title>
		<rect x="3.5" y="5.5" width="17" height="13"></rect>
		<path class="pfbt-icon-fill" d="M11 9 L15 12 L11 15 Z"></path>
		<path d="M3.5 9 H7"></path>
		<path d="M17 9 H20.5"></path>
		<path d="M3.5 15 H7"></path>
		<path d="M17 15 H20.5"></path>
	</symbol>
</svg>
